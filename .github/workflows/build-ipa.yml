name: Build IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode (unsigned = 越狱/AppSync 免签名安装)'
        required: false
        default: 'unsigned'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild build \
            -project MagnetPlayer.xcodeproj \
            -scheme MagnetPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            -quiet

      - name: Ad-hoc sign & package IPA
        run: |
          APP="$PWD/build/app/MagnetPlayer.app"
          codesign --force --sign - "$APP" 2>/dev/null || echo "codesign skipped"
          mkdir -p "$PWD/build/Payload"
          cp -R "$APP" "$PWD/build/Payload/"
          ( cd "$PWD/build" && zip -qry MagnetPlayer.ipa Payload )

      - name: Inspect IPA
        run: python3 .github/scripts/inspect_ipa.py build/MagnetPlayer.ipa || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetPlayer.ipa
          path: build/MagnetPlayer.ipa
